<title>ACOUSMA FOURTH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* ACOUSMA — black and white only.
   States are carried by form: filled = on/selected, outline = off,
   dashed = bypassed, struck / cut = muted, inverted number = playhead. */

:root {
  --black: #000;
  --white: #fff;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "Fragment Mono", ui-monospace, Menlo, Consolas, monospace;
  --label: 120px; /* sequencer label column */
  --tail: 300px; /* sequencer right column */
  --touch: 40px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--white); color: var(--black); font: 12px/1.35 var(--sans); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; }
[hidden] { display: none !important; }

.label, label, .meta, .group, small {
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
}
.value, output, .num, .step, .tab, .meta, .group, .foot { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ── Page ── */
.device { max-width: 1440px; margin: 0 auto; padding: 40px 48px 48px; display: flex; flex-direction: column; gap: 40px; }
.sec { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sec-head { display: flex; align-items: center; gap: 12px; }
.sec-head h2 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
.sec-head .rule { flex: 1; height: 1px; background: var(--black); }
.sec-head .rule.short { flex: 0 0 24px; } /* the gap before it is the motif */
.foot { display: flex; justify-content: space-between; gap: 16px; padding-top: 16px; border-top: 1px solid var(--black); font-size: 11px; }

/* ── Header ── */
.topbar { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
.identity { display: flex; align-items: center; gap: 14px; margin-right: auto; }
.identity h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.42em; }
.motif svg path, .glyph path { fill: none; stroke: var(--black); stroke-width: 1.2; }
.tempo { width: 200px; }
.transport { display: flex; gap: 8px; }
.btn { height: 32px; padding: 0 14px; border: 1px solid var(--black); background: var(--white); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
.btn.start:disabled { border-color: transparent; cursor: default; text-decoration: underline; }
.btn.play[aria-pressed="true"] { background: var(--black); color: var(--white); }
.btn.cut { border-width: 2px; }
.select { display: flex; flex-direction: column; gap: 8px; }
select { height: 28px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--black); border-radius: 0; background: var(--white); font-family: var(--mono); }
.preset select { min-width: 180px; }

/* ── Controls ── */
.slider { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px; min-width: 0; }
.slider output { font-size: 12px; }
.slider input { grid-column: 1 / -1; }
input[type="range"] {
  --p: 50%;
  -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; cursor: pointer; touch-action: pan-y;
  background: linear-gradient(var(--black), var(--black)) 0 50% / var(--p) 2px no-repeat,
    linear-gradient(var(--black), var(--black)) 0 50% / 100% 1px no-repeat;
}
input[type="range"]::-webkit-slider-runnable-track { height: 20px; background: transparent; }
input[type="range"]::-moz-range-track { background: transparent; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 3px; height: 16px; margin-top: 2px; background: var(--black); border: 0; }
input[type="range"]::-moz-range-thumb { width: 3px; height: 16px; background: var(--black); border: 0; border-radius: 0; }

.options { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.opt-row { display: flex; }
.opt, .tog.opt { flex: 1; height: 32px; padding: 0 12px; border: 1px solid var(--black); margin-left: -1px; background: var(--white); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
.opt[aria-pressed="true"] { background: var(--black); color: var(--white); }
.tog.opt { flex: 0 0 auto; margin: 0; }
.quiet { border: 0; background: none; padding: 4px 6px; font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: underline; cursor: pointer; }
.ms { width: 28px; height: 24px; border: 1px solid var(--black); background: var(--white); font-weight: 600; font-size: 11px; cursor: pointer; }
.ms[aria-pressed="true"] { background: var(--black); color: var(--white); }

/* ── Signal display ── */
.plot { position: relative; height: 176px; }
.plot .baseline { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--black); opacity: 1; }
.trace { position: absolute; inset: 0; width: 100%; height: 100%; }
.head { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--black); }
.ticks { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(16, 1fr); height: 10px; }
.ticks i { border-left: 1px solid var(--black); height: 5px; align-self: end; }
.ticks i:nth-child(4n + 1) { height: 10px; }

/* ── Sources ── */
.voices { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
.voice { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.voice-head { display: flex; align-items: center; gap: 10px; }
.voice-head h3 { margin-right: auto; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.voice-head .opt { flex: 0 0 auto; }
.row { display: grid; gap: 24px 32px; align-items: end; }
.row.two { grid-template-columns: 1fr 1fr; }
.row.four { grid-template-columns: repeat(4, 1fr); gap: 24px; }
.row.secondary { padding-top: 16px; border-top: 1px solid var(--black); }

/* ── Sequence & impact ── */
.line { display: grid; grid-template-columns: var(--label) minmax(0, 1fr) var(--tail); gap: 24px; align-items: start; }
.line-label { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.line-label strong { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.line-tail { display: flex; align-items: end; gap: 16px; }
.line-tail .slider { flex: 1; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.beat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.num { text-align: center; font-size: 10px; padding: 1px 0; }
.num.now { background: var(--black); color: var(--white); } /* playhead */

.step { position: relative; height: var(--touch); width: 100%; padding: 0; border: 1px solid var(--black); background: var(--white); font-size: 10px; cursor: pointer; }
.step[aria-pressed="true"] { background: var(--black); color: var(--white); }
.step.accent::before { content: ""; position: absolute; top: 5px; left: 33%; right: 33%; height: 2px; background: var(--white); }
.step.now, .col.now .step { outline: 2px solid var(--black); outline-offset: 2px; }
.tab { height: 22px; border: 0; border-bottom: 1px solid var(--black); background: none; font-size: 10px; cursor: pointer; }
.tab[aria-pressed="true"] { border-bottom-width: 3px; font-weight: 700; }

.line.editor { padding-top: 16px; border-top: 1px solid var(--black); grid-template-columns: var(--label) minmax(0, 1fr); align-items: end; }
.fields { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 32px; align-items: end; padding-right: calc(var(--tail) + 24px); }
.result { display: flex; flex-direction: column; gap: 6px; }

.line.muted .step { border-style: dashed; }
.line.muted .step[aria-pressed="true"] { background: var(--white); color: var(--black); }
.muted strong { text-decoration: line-through; }
.muted .glyph .g-b { display: none; } /* the trace is cut */

/* ── Mixer & effects ── */
.output { display: grid; grid-template-columns: 520px minmax(0, 1fr); gap: 64px; align-items: start; }
.channel { display: grid; grid-template-columns: 28px 92px 56px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; }
.channel.bus { grid-template-columns: 28px 92px 56px minmax(0, 1fr); padding-right: 68px; }
.channel strong { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.channel .slider label { display: none; }
.meter { height: 6px; border: 1px solid var(--black); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--black); transform-origin: left; transform: scaleX(0); }
.group { padding-top: 8px; }

.chain { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.unit { display: flex; flex-direction: column; gap: 16px; padding-top: 12px; border-top: 2px solid var(--black); min-width: 0; }
.unit-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.unit-head strong { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.unit-body { display: flex; flex-direction: column; gap: 16px; }
.switch { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
.switch::before { content: ""; width: 10px; height: 10px; border: 1px solid var(--black); }
.switch[aria-pressed="true"]::before { background: var(--black); }
.switch[aria-pressed="false"]::before { border-style: dashed; }
.unit.bypassed { border-top: 2px dashed var(--black); }
.unit.bypassed .unit-head strong { text-decoration: line-through; }

/* ── Narrow screens: same order, steps wrap 1–8 / 9–16 ── */
@media (max-width: 1100px) {
  .output { grid-template-columns: 1fr; }
  .fields { padding-right: 0; }
}
@media (max-width: 820px) {
  .device { padding: 24px 16px 32px; gap: 32px; }
  .voices, .row.two, .chain { grid-template-columns: 1fr; gap: 24px; }
  .row.four { grid-template-columns: 1fr 1fr; }
  .line, .line.editor { grid-template-columns: 1fr; gap: 10px; }
  .ruler .line-label, .ruler .line-tail { display: none; }
  .steps { grid-template-columns: repeat(2, 1fr); row-gap: 8px; }
  .fields { grid-template-columns: 1fr 1fr; }
  .fields .slider { grid-column: 1 / -1; }
  .step { height: 44px; }
  .tempo, .preset { width: 100%; }
  .transport { width: 100%; }
  .transport .btn { flex: 1; height: 44px; }
  .channel { grid-template-columns: 28px 80px minmax(0, 1fr) auto auto; }
  .channel .meter { display: none; }
  .channel.bus { grid-template-columns: 28px 80px minmax(0, 1fr); padding-right: 0; }
}

/* small alignment fixes */
.channel .slider output { grid-column: 2; }
.sec-head .opt { flex: 0 0 auto; white-space: nowrap; }

/* ═════════ PERFORM view — one 16:9 screen, 1440 × 810 reference frame, scaled to the window ═════════ */
body.is-perform { overflow: hidden; }
.pv-wrap { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; background: var(--white); }
.pv-wrap > .pv { width: 1440px; height: 810px; transform: scale(var(--u, 1)); transform-origin: top center; flex: none; padding: 28px 48px 24px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.pv-top { display: flex; align-items: center; gap: 20px; height: 40px; }
.pv-identity { display: flex; align-items: center; gap: 18px; margin-right: auto; }
.pv-identity h1 { font-size: 20px; letter-spacing: 0.22em; }
.pv-motif svg { display: block; fill: none; stroke: var(--black); stroke-width: 1.2; }
.pv-cue { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; min-width: 260px; text-align: right; }
.pv-clock { font-family: var(--mono); font-size: 14px; min-width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
.pv-clock small { opacity: 0.5; }
.pv-btn { height: 34px; padding: 0 18px; border: 1.5px solid var(--black); background: var(--white); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
.pv-go { background: var(--black); color: var(--white); min-width: 96px; }
.pv-go.pv-reset { background: var(--white); color: var(--black); }
.pv-btn:disabled { opacity: 0.5; cursor: wait; }

.pv-disp { position: relative; height: 330px; border-top: 1.5px solid var(--black); border-bottom: 1.5px solid var(--black); overflow: hidden; background: var(--white); }
.pv-disp canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pv-ghost { opacity: 0.2; }
.pv-veil { position: absolute; top: 0; bottom: 0; background: var(--white); pointer-events: none; }
.pv-baseline { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--black); opacity: 0.25; }
.pv-ticks { position: absolute; inset: auto 0 0 0; height: 8px; display: grid; grid-template-columns: repeat(16, 1fr); }
.pv-ticks i { border-left: 1px solid var(--black); opacity: 0.35; }
.pv-ticks i:nth-child(4n+1) { opacity: 0.8; height: 8px; }
.pv-ticks i:not(:nth-child(4n+1)) { height: 4px; align-self: end; }
.pv-head { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--black); opacity: 0.35; pointer-events: none; }
.pv-head.on { border-color: #e4261b; opacity: 0.9; }

.pv-under { display: flex; justify-content: space-between; align-items: center; height: 22px; }
.pv-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
.pv-meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
.pv-scale { display: flex; align-items: center; gap: 10px; }
.pv-bar { position: relative; width: 180px; height: 1px; background: var(--black); }
.pv-bar i { position: absolute; top: -4px; width: 1.5px; height: 9px; background: var(--black); }

.pv-rule { position: relative; height: 3px; }
.pv-all, .pv-done { position: absolute; left: 0; top: 1px; height: 1px; }
.pv-all { width: 100%; background: rgba(0,0,0,0.2); }
.pv-done { background: var(--black); height: 2px; top: 0; }
.pv-gap { position: absolute; top: -3px; width: 10px; height: 9px; margin-left: -5px; background: var(--white); border-left: 1px solid var(--black); border-right: 1px solid var(--black); }

.pv-perform { display: grid; grid-template-columns: 1fr 1fr 1fr 220px; gap: 36px; margin-top: 6px; }
.pv-macro { display: flex; flex-direction: column; gap: 6px; }
.pv-mhead { display: flex; justify-content: space-between; align-items: baseline; }
.pv-val { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.pv-plain { font-size: 11px; opacity: 0.6; }
.pv-track { position: relative; height: 44px; touch-action: none; cursor: ew-resize; user-select: none; }
.pv-line { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--black); }
.pv-fill { position: absolute; left: 0; top: calc(50% - 2px); height: 4px; background: var(--black); }
.pv-auto { position: absolute; top: 8px; bottom: 8px; width: 2px; margin-left: -1px; background: var(--black); }
.pv-tether { position: absolute; top: calc(50% - 1px); height: 2px; background: #e4261b; opacity: 0.6; display: none; }
.pv-hand { position: absolute; top: 10px; width: 12px; height: 24px; margin-left: -6px; background: #e4261b; display: none; }
.pv-touched .pv-hand, .pv-touched .pv-tether { display: block; }
.pv-read { font-family: var(--mono); font-size: 10px; opacity: 0.65; min-height: 14px; }

.pv-break { display: flex; flex-direction: column; gap: 8px; }
.pv-breakbtn { height: 64px; border: 1.5px dashed var(--black); background: var(--white); font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: not-allowed; opacity: 0.6; }
.pv-sub { font-family: var(--mono); font-size: 10px; opacity: 0.7; min-height: 14px; }
.pv-armed .pv-breakbtn, .pv-pending .pv-breakbtn { border: 3px solid var(--black); cursor: pointer; opacity: 1; }
.pv-pending .pv-breakbtn { border-color: #e4261b; }
.pv-fired .pv-breakbtn { border: 1.5px solid var(--black); background: var(--black); color: var(--white); opacity: 1; cursor: default; }

.pv-studio, .to-perform { position: absolute; right: 48px; bottom: 14px; border: 0; background: none; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: underline; cursor: pointer; opacity: 0.6; }
.to-perform { position: static; }

/* TUNE panel */
.pv-tune { margin-top: 4px; padding: 12px 0 0; border-top: 1px solid var(--black); display: flex; flex-direction: column; gap: 10px; }
.pv-tune-head { display: flex; justify-content: space-between; align-items: center; }
.pv-from { border: 1.5px solid var(--black); background: var(--white); height: 26px; font-size: 11px; font-family: var(--mono); padding: 0 6px; }
.pv-knobs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px 20px; }
.pv-knob { display: flex; flex-direction: column; gap: 6px; }
.pv-knob input[type=range] { width: 100%; accent-color: #000; margin: 0; }
.pv-tune-out { font-family: var(--mono); font-size: 10px; opacity: 0.6; }
.pv-tunebtn { position: absolute; right: 120px; bottom: 14px; border: 0; background: none; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: underline; cursor: pointer; opacity: 0.6; }

html, body { margin: 0; padding: 0; background: #fff; color: #000; }
</style>

		 * Push a value onto the end
		 * @param channel number
		 * @param value number
		 */
		push(channel, value) {
			this.writeHead[channel] += 1;
			if (this.writeHead[channel] > this.size) {
				this.writeHead[channel] = 0;
			}
			this.buffer[channel][this.writeHead[channel]] = value;
		}

		 * Get the recorded value of the channel given the delay
		 * @param channel number
		 * @param delay number delay samples
		 */
		get(channel, delay) {
			let readHead = this.writeHead[channel] - Math.floor(delay);

			}

		}
	}
